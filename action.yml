name: wormsign scan
description: Fail CI when a lockfile pins a known-malicious npm or PyPI version, or the repo contains worm persistence (agent hooks, auto-run tasks, backdoored workflows).
author: mansoor-mamnoon
branding:
  icon: shield
  color: red
inputs:
  path:
    description: Directory to scan.
    default: "."
  version:
    description: wormsign version to install, for example 0.1.1. Defaults to the latest release.
    default: ""
  args:
    description: Extra flags, for example "--strict" to fail on warnings too.
    default: ""
runs:
  using: composite
  steps:
    - name: Install wormsign
      shell: bash
      env:
        WORMSIGN_VERSION: ${{ inputs.version }}
        WORMSIGN_INSTALL_DIR: ${{ runner.temp }}/wormsign
      run: sh "$GITHUB_ACTION_PATH/install.sh"
    - name: Scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_ARGS: ${{ inputs.args }}
      run: |
        set +e
        # SCAN_ARGS is unquoted on purpose so several flags split into words.
        "$RUNNER_TEMP/wormsign/wormsign" --project --no-color $SCAN_ARGS "$SCAN_PATH" | tee "$RUNNER_TEMP/wormsign.txt"
        code=${PIPESTATUS[0]}
        {
          echo '### wormsign'
          echo '```text'
          cat "$RUNNER_TEMP/wormsign.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
