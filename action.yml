name: wormsign scan
description: Fails CI when a lockfile pins a known-malicious npm or PyPI version, or the repo contains worm persistence.
author: mansoor-mamnoon
branding:
  icon: shield
  color: red
inputs:
  path:
    description: Directory to scan.
    default: "."
  version:
    description: wormsign version to install, for example 0.1.4. Defaults to the latest release.
    default: ""
  args:
    description: Whitespace-separated extra flags, for example "--strict". Shell quoting and glob expansion are not supported.
    default: ""
runs:
  using: composite
  steps:
    - name: Install wormsign
      shell: bash
      env:
        WORMSIGN_VERSION: ${{ inputs.version }}
        WORMSIGN_INSTALL_DIR: ${{ runner.temp }}/wormsign
      run: sh "$GITHUB_ACTION_PATH/install.sh"
    - name: Scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_ARGS: ${{ inputs.args }}
      run: |
        set +e
        # Split flags on whitespace, without expanding wildcard filenames.
        set -f
        scan_args=($SCAN_ARGS)
        "$RUNNER_TEMP/wormsign/wormsign" --project --no-color "${scan_args[@]}" -- "$SCAN_PATH" 2>&1 | tee "$RUNNER_TEMP/wormsign.txt"
        statuses=("${PIPESTATUS[@]}")
        code=${statuses[0]}
        if [ "${statuses[1]}" -ne 0 ] && [ "$code" -eq 0 ]; then
          code=2
        fi
        {
          echo '### wormsign'
          echo '```text'
          cat "$RUNNER_TEMP/wormsign.txt" || exit 2
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY" || exit 2
        exit "$code"
