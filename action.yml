name: wormsign scan
description: Scans a repository for known-malicious npm or PyPI versions and supported persistence indicators.
author: mansoor-mamnoon
branding:
  icon: shield
  color: red
inputs:
  path:
    description: Directory to scan.
    default: "."
  version:
    description: Scanner version to use. Defaults to building this exact Action revision; set a release version to download it.
    default: "source"
  args:
    description: Whitespace-separated extra flags, for example "--strict". Shell quoting and glob expansion are not supported.
    default: ""
runs:
  using: composite
  steps:
    - name: Install wormsign
      shell: bash
      env:
        WORMSIGN_VERSION: ${{ inputs.version }}
        WORMSIGN_INSTALL_DIR: ${{ runner.temp }}/wormsign
      run: |
        if [ "$WORMSIGN_VERSION" = source ]; then
          mkdir -p "$WORMSIGN_INSTALL_DIR"
          cd "$GITHUB_ACTION_PATH"
          GOWORK=off go build -trimpath -o "$WORMSIGN_INSTALL_DIR/wormsign" .
        else
          sh "$GITHUB_ACTION_PATH/install.sh"
        fi
    - name: Scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_ARGS: ${{ inputs.args }}
      run: |
        marker=$(openssl rand -hex 32)
        echo "::stop-commands::$marker"
        set +e
        # Split flags on whitespace, without expanding wildcard filenames.
        set -f
        scan_args=($SCAN_ARGS)
        "$RUNNER_TEMP/wormsign/wormsign" --project --no-color "${scan_args[@]}" -- "$SCAN_PATH" 2>&1 | tee "$RUNNER_TEMP/wormsign.txt"
        statuses=("${PIPESTATUS[@]}")
        echo "::$marker::"
        code=${statuses[0]}
        if [ "${statuses[1]}" -ne 0 ] && [ "$code" -eq 0 ]; then
          code=2
        fi
        {
          echo '### wormsign'
          echo
          sed 's/^/    /' "$RUNNER_TEMP/wormsign.txt" || exit 2
        } >> "$GITHUB_STEP_SUMMARY" || exit 2
        exit "$code"
