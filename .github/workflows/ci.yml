name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.11", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting with minimum Go version
        if: runner.os != 'Windows' && matrix.go == '1.26.11'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Test minimum Go version
        if: matrix.go == '1.26.11'
        run: go test ./...
      - name: Test with race detector
        if: matrix.go == '1.27.x'
        run: go test -race ./...
      - name: demo smoke test
        run: go run . --demo --offline

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.26.11"
      - uses: ./
        with:
          path: .

  action-incomplete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.26.11"
      - name: Plant a directory beyond the scan limit
        run: mkdir -p "$RUNNER_TEMP/deep/a/b/c/d/e/f/g/h/i/j/k/l/m/n/o"
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/deep
          args: --offline
      - name: An incomplete scan must fail the build
        if: steps.scan.outcome != 'failure'
        run: exit 1

  action-detects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.26.11"
      - name: Plant a known-malicious lockfile entry
        run: |
          mkdir -p "$RUNNER_TEMP/infected"
          echo '{"lockfileVersion":3,"packages":{"node_modules/keyv":{"version":"6.0.0"}}}' > "$RUNNER_TEMP/infected/package-lock.json"
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/infected
      - name: The action must fail the build
        if: steps.scan.outcome != 'failure'
        run: exit 1
